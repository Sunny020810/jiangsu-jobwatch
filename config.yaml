# ===== 江苏高职招聘监控：配置文件 =====
# 改完提交即可，下一次运行自动生效。

# 要监控的学校类型（对应 schools.yaml 里的 type）
include_types: [公办专科, 民办专科, 中外合作专科, 职业本科]

# 报告里展示多少天内发布的公告（首次运行时也用它来补抓近期的存量公告）
report_window_days: 60
# 超过这个天数的旧公告不再进入报告（发布日期未知的一律保留）
max_age_days: 180

# ---------- 匹配规则 ----------
# 强匹配：出现在“专业要求”里，就算是金融对口
# 说明：江苏事业单位招聘按《江苏省考试录用公务员专业参考目录》写专业，
#       金融学、金融硕士都归在“经济类”下，所以“经济类”也算强匹配。
finance_strong: [金融, 应用经济学, 经济类, 经济学类, 经济学门类, 财政金融, 金融科技, 证券, 投资学, 保险学]
# 弱匹配：可能接受金融硕士，需要你看一眼
finance_weak: [经济学, 经济, 财务财会类, 财会, 会计, 审计, 统计, 工商管理, 管理学, 商科, 国际贸易, 电子商务, 财经]
# 岗位类型识别
role_keywords:
  专任教师: [专任教师, 专业教师, 教师岗, 教学岗, 讲师]
  辅导员: [辅导员, 思政, 学生工作, 学工]
  行政管理: [管理岗, 行政, 管理人员, 科员, 干事, 党务, 人事, 财务, 教务, 招生就业, 专职组织员]
  实验实训: [实验, 实训, 实习指导]
  其他: []

# ---------- 抓取设置 ----------
request_timeout: 25        # 单个请求超时（秒）
request_retries: 2         # 失败重试次数
request_delay: 0.4         # 同一线程两次请求之间的间隔（秒），别太快，避免被封
workers: 8                 # 并发线程数
allow_insecure_ssl: true   # 很多学校网站证书有问题，允许跳过校验（只读取公开信息）
max_attachment_mb: 15      # 附件最大下载体积
rediscover_days: 7         # 每隔多少天重新探测一次学校的招聘栏目

# 每天用搜索引擎补充检索的学校数（轮换，大约每周把所有学校都搜一遍）
search_schools_per_day: 15

# ---------- 汇总类数据源 ----------
# type: portal = 从入口页里按关键词找招聘栏目，再抓栏目里的公告
#       list   = 直接是公告列表页
# url 留空或失效时，会按 name 用搜索引擎自动找官网。
portals:
  - {name: 江苏省人力资源和社会保障厅, type: portal, url: "https://jshrss.jiangsu.gov.cn/", nav: [事业单位公开招聘, 事业单位招聘, 公开招聘, 招聘公告]}
  - {name: 江苏省教育厅, type: portal, url: "https://jyt.jiangsu.gov.cn/", nav: [招聘, 公开招聘, 人事]}
  - {name: 高校人才网-江苏, type: list, url: "https://www.gaoxiaojob.com/column/21.html"}
  - {name: 高校人才网-高校招聘, type: list, url: "https://www.gaoxiaojob.com/column/1.html"}
  - {name: 南京市人力资源和社会保障局, type: portal, url: "https://rsj.nanjing.gov.cn/", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 苏州市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 无锡市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 常州市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 镇江市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 扬州市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 泰州市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 南通市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 盐城市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 淮安市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 连云港市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 宿迁市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}
  - {name: 徐州市人力资源和社会保障局, type: portal, url: "", nav: [事业单位招聘, 公开招聘, 人事考试]}

# 每天都跑的全局搜索（只取最近一周的结果）
search_queries:
  - 江苏 职业技术学院 招聘 公告
  - 江苏 职业学院 公开招聘 专任教师
  - 江苏 职业学院 招聘 辅导员
  - 江苏 高职 招聘 金融 硕士
  - 江苏 职业技术学院 人才引进 经济类
  - 江苏 高等专科学校 招聘 公告
  - 江苏 职业技术大学 招聘 公告

# ---------- 通知 ----------
# 具体的密钥放在 GitHub 仓库的 Settings → Secrets，不要写在这里。
notify:
  github_issue: true       # 每天在仓库里开一个 Issue（手机装 GitHub App 就能收到推送），无需额外配置
  only_when_new: false     # true = 没有新公告就不推送；false = 每天都推送（含“今天无新增”和抓取健康情况）
