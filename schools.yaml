# 来源：教育部全国高等学校名单（2026 版，经大学生必备网整理）及江苏省政府升格通知。
#
# 学校官网对照：江苏省教育厅《江苏省普通高等学校名单》
# https://jyt.jiangsu.gov.cn/art/2026/3/5/art_77627_10220590.html
# 江苏财经职业技术学院官网另据省教育考试院：https://www.jseea.cn/webfile/yxdt/2015-08-12/18318.html
# 扬州环境资源职业技术学院、应天职业技术学院未确认独立招聘官网，保留学校记录。
#
# 字段说明：
#   name          学校全称（用于在聚合网站、搜索结果里识别）
#   city          所在城市
#   type          公办专科 / 民办专科 / 中外合作专科 / 职业本科
#   homepage      学校官网首页。程序校验网页中的校名，
#                 不匹配时会通过搜索引擎自动找到正确官网，并记在 state/sites.json 里。
#   recruit_pages 可选。如果你知道学校的人事处“招聘信息”栏目网址，可以直接填在这里，
#                 程序会优先使用，最稳妥。
#   aliases       可选。学校的简称或曾用名，用来匹配聚合网站上的标题。
#
# 增加学校：照着格式加一段即可。不想看某类学校：在 config.yaml 的 include_types 里去掉。

